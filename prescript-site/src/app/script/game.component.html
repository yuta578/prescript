<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div id="round-label">ronda 1</div>

<!-- SVG FLECHAS — fijo sobre todo, z-index bajo la arena -->
<svg id="arrows-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c8903a" opacity="0.9"/>
    </marker>
  </defs>
</svg>

<!-- ARENA DE CLASH — aparece en el centro durante la resolución -->
<div id="clash-arena">
  <div id="clash-arena-inner">
    <div id="clash-player-ghost" class="clash-ghost player-ghost"></div>
    <div id="clash-vs">
      <span id="clash-vs-label">CHOQUE</span>
      <span id="clash-score"></span>
    </div>
    <div id="clash-enemy-ghost" class="clash-ghost enemy-ghost"></div>
  </div>
</div>

<!-- LAYOUT PRINCIPAL: columna de juego + barra presión derecha -->
<div id="game">

  <div id="main-col">

    <!-- ══ ZONA ENEMIGO (arriba) ══ -->
    <div id="enemy-area">
      <div id="enemy-header">
        <div id="enemy-name">estado mental</div>
        <div id="enemy-hp-wrap"><div id="enemy-hp-fill" style="width:100%"></div></div>
      </div>
      <div id="enemy-phrase">...</div>
      <div id="enemy-cards-row"></div>
    </div>

    <!-- ══ ZONA CENTRAL — espacio libre, aquí vuelan las cartas ══ -->
    <div id="arena-space"></div>

    <!-- ══ MANO DEL JUGADOR (abajo) ══ -->
    <div id="hand"></div>

    <!-- ══ ACCIONES ══ -->
    <div id="actions">
      <button class="action-btn" id="btn-end">terminar turno</button>
      <button class="action-btn primary" id="btn-draw">robar carta</button>
      <button class="action-btn accent" id="btn-confirm" style="display:none;">⚔ confirmar choques</button>
    </div>

    <!-- ══ HUD — debajo de botones ══ -->
    <div id="hud">
      <div class="hud-block">
        <span class="hud-label">HP</span>
        <span class="hud-val stat-hp" id="stat-hp">20</span>
      </div>
      
      <div class="hud-sep">·</div>
      <div class="hud-block">
        <span class="hud-label">MONEDAS</span>
        <div id="coins-visual"></div>
      </div>
      <div class="hud-sep">·</div>
      <div class="hud-block">
        <span class="hud-label">MAZO</span>
        <span class="hud-val" id="stat-deck">0</span>
      </div>
      <div class="hud-sep" id="prescrip-sep" style="display:none;">·</div>
      <div id="stat-prescrip" class="hud-prescrip"></div>
    </div>

  </div>

  <!-- ══ BARRA PRESIÓN VERTICAL DERECHA ══ -->
  <div id="pressure-col">
    <div id="pressure-pct">100%</div>
    <div id="pressure-bar-v">
      <div id="pressure-fill-v" style="height:100%"></div>
    </div>
    <div id="pressure-lbl">presión</div>
  </div>

</div>

<!-- OVERLAY ENTRE RONDAS / GAME OVER -->
<div id="overlay">
  <div id="prescrip-top" style="
    width:min(480px,90vw);border:1px solid #1e1e1e;background:#0a0a0a;
    padding:14px 20px;display:flex;flex-direction:column;gap:8px;
    min-height:70px;justify-content:center;">
    <div id="prescrip-top-text" style="font-size:14px;font-style:italic;color:#c8c0b0;line-height:1.6;font-family:'IM Fell English',serif;min-height:1.6em;"></div>
    <div id="prescrip-top-tags" style="display:flex;gap:16px;"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0;">
    <div id="flor-comment" style="font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:#555;font-family:'IM Fell English',serif;opacity:0;transition:opacity 0.5s ease;min-height:14px;"></div>
    <img src="flor.png" alt="" style="width:80px;height:80px;object-fit:contain;opacity:0.7;">
  </div>
  <div id="prescrip-bot" style="
    width:min(480px,90vw);border:1px solid #1e1e1e;background:#0a0a0a;
    padding:14px 20px;display:flex;flex-direction:column;gap:8px;
    min-height:70px;justify-content:center;">
    <div id="prescrip-bot-text" style="font-size:14px;font-style:italic;color:#c8c0b0;line-height:1.6;font-family:'IM Fell English',serif;min-height:1.6em;"></div>
    <div id="prescrip-bot-tags" style="display:flex;gap:16px;"></div>
  </div>
  <button class="action-btn primary" id="btn-next-round" style="margin-top:14px;display:none;">siguiente ronda</button>
</div>
